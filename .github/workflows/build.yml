name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The full TeX Live image, because the package needs LuaLaTeX plus
    # tcolorbox, fvextra, expkv-def, unicode-math and the Latin Modern and
    # Source Sans families. A minimal image would fail on fonts, and the
    # missing-glyph check would turn that into a confusing test failure rather
    # than a clear missing-package error.
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        # pdftotext and pdfinfo drive the content assertions; python3 strips
        # Freemarker comments for the ftl-emits-raw-data lint.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends poppler-utils python3

      # texlive/texlive:latest does not ship Source Sans Pro, which the package
      # uses for every heading. Locally it arrives via Debian's
      # texlive-fonts-extra, which is why this only ever failed in CI: 14 of 17
      # cases died with "The font SourceSansPro-Regular cannot be found".
      #
      # xcharter is for the test suite, not the package: selftest-missing-glyph
      # feeds XCharter to the missing-glyph detector precisely because it lacks
      # the Vietnamese hook-above characters.
      - name: Install TeX Live fonts not in the image
        run: |
          tlmgr install sourcesanspro xcharter || \
            echo "tlmgr install failed; the font check below will report what is missing"

      # These three steps EXIT NON-ZERO on anything missing. An earlier version
      # printed "MISSING" and exited 0, so the step went green and its success
      # proved nothing. They are separate steps because step conclusions are
      # readable from the public API while job logs are not -- so which of the
      # three fails is itself the diagnosis.
      - name: Check fonts
        run: |
          miss=0
          for f in lmroman10-regular.otf lmroman10-bold.otf lmroman10-italic.otf \
                   lmmono10-regular.otf lmmonolt10-bold.otf latinmodern-math.otf \
                   SourceSansPro-Regular.otf SourceSansPro-Semibold.otf \
                   SourceSansPro-Bold.otf XCharter-Roman.otf; do
            if kpsewhich "$f" >/dev/null; then echo "ok      $f"
            else echo "MISSING $f"; miss=1; fi
          done
          exit $miss

      - name: Check packages
        run: |
          miss=0
          for p in tcolorbox fvextra expkv-def unicode-math hhline tabularx \
                   colortbl lastpage microtype fancyhdr etoolbox xstring \
                   fontspec geometry graphicx array xcolor; do
            if kpsewhich "$p.sty" >/dev/null; then echo "ok      $p"
            else echo "MISSING $p"; miss=1; fi
          done
          exit $miss

      - name: Check tools
        run: |
          miss=0
          for t in lualatex pdftotext pdfinfo python3 make bash; do
            if command -v "$t" >/dev/null; then echo "ok      $t"
            else echo "MISSING $t"; miss=1; fi
          done
          lualatex --version | head -1
          exit $miss

      - name: Run test suite
        id: suite
        run: |
          set -o pipefail
          tests/run.sh 2>&1 | tee suite.out

      # Artifact NAMES are readable from the public API even when logs are not,
      # so the names of the failing cases are encoded into one. Without this a
      # red build is opaque to anyone without repository admin rights.
      - name: Publish failing case names
        if: failure() && steps.suite.outcome == 'failure'
        run: |
          # ANSI is stripped defensively. tests/run.sh disables colour when
          # stdout is not a tty, which it isn't through tee -- but a parser
          # that silently yields nothing would be worse than a redundant sed.
          sed 's/\x1b\[[0-9;]*m//g' suite.out > suite.plain
          cases=$(grep -E '^[[:space:]]*FAIL' suite.plain | awk '{print $2}' | tr '\n' '_' | sed 's/_$//')
          [ -n "$cases" ] || cases="none-parsed"
          mkdir -p failure-marker
          cp suite.out failure-marker/ 2>/dev/null || true
          echo "MARKER_NAME=failing__${cases}" >> "$GITHUB_ENV"

      - name: Upload failure marker
        if: failure() && env.MARKER_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MARKER_NAME }}
          path: failure-marker/
          if-no-files-found: ignore

      - name: Build samples
        run: make samples

      # Printed inline as well, grouped per file, because downloading artifacts
      # also needs admin rights and this is what a human debugging a red build
      # actually needs to see.
      - name: Show LaTeX logs on failure
        if: failure()
        run: |
          for f in $(find build/tests samples -name '*.log' 2>/dev/null); do
            if grep -q '^!' "$f"; then
              echo "::group::$f"
              grep -m3 -A8 '^!' "$f"
              echo "::endgroup::"
            fi
          done

      # NOT if: always(). Paired with if-no-files-found: error, an always-run
      # upload fails a second time whenever an earlier step skipped the sample
      # build -- which buries the actual failure under a spurious one.
      - name: Upload PDFs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sample-pdfs
          path: build/samples/*.pdf
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/tests/**/*.log
            samples/**/*.log
            suite.out
          if-no-files-found: ignore
